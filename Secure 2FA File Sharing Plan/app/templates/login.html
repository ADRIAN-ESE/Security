{% extends "base.html" %}
{% block title %}Log in — SecureShare{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Welcome back</h1>
  <p class="muted">Factor 1 of 2: your password.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username
      <input type="text" name="username" required autocomplete="username">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="muted center">No account yet? <a href="{{ url_for('auth.register') }}">Register</a></p>
</div>
{% endblock %}
